[build]
  publish = "."

[[headers]]
  for = "/still-mobile/assets/*.mp3"
  [headers.values]
    Content-Type = "audio/mpeg"

[[headers]]
  for = "/still-mobile/src/audio/*.mp3"
  [headers.values]
    Content-Type = "audio/mpeg"

[[headers]]
  for = "/still-mobile/src/audio/*.mp4"
  [headers.values]
    Content-Type = "audio/mp4"

# assets/candle.mp4 is a 72×108px decorative candle-flame loop used in the
# Night Watch screen. Google Search Console flagged it as a video with no
# thumbnail URL. X-Robots-Tag: noindex suppresses it from video indexing
# without touching the page itself — equivalent to meta robots="noindex" on
# just this resource.
[[headers]]
  for = "/assets/candle.mp4"
  [headers.values]
    X-Robots-Tag = "noindex"
    
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The traditional Office corpus travels inside the office-corpus function's
# bundle rather than being served. /corpus/* stays a forced 404 below: the
# function reads these files off its own disk, nothing fetches them over HTTP.
#
# ~21 MB across 1,479 proper documents. Well inside Lambda's limits, but it is
# the dominant cost of this function's deploy and cold start. Vigils alone is
# 71% of it (~17 KB/document vs ~3 KB for Vespers); if bundle time or cold
# start becomes a problem, split Vigils into its own function rather than
# trimming coverage.
[functions."office-corpus"]
  included_files = [
    "corpus/traditional/calendar/*.json",
    "corpus/traditional/calendar-index.json",
    "corpus/traditional/store/*.json",
    "corpus/traditional/propers/**/*.json"
  ]

[functions.send-notifications]
  schedule = "0 1 * * *"

# The four bell-*.js schedules are gone. They ran hourly -- 96 invocations a day
# -- pushing through OneSignal, whose web SDK was removed in 2391f30 with
# nothing put in its place, so every one of those pushes reached nobody. Bells
# are delivered by on-device local notifications from bell-native.js, which is
# the only path and needs no cron. The functions themselves are left on disk;
# see the OneSignal cleanup item in docs/still-phases.md.
  
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/still-mobile/*"
  to = "/still-mobile/:splat"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

# The partner commission portal. A passthrough, NOT a block: this is a real
# page that has to be served. It is gated in the browser, not here -- a forced
# 404 cannot tell a signed-in rep from anyone else and would lock out the
# people it exists for.
#
# Nothing sensitive ships in the page. The anon key in it is public by design
# (it is already in index.html), every figure arrives from
# /.netlify/functions/referral-report, and that function refuses without a
# valid Supabase JWT and filters by the caller's own email.
[[redirects]]
  from   = "/partners"
  to     = "/partners.html"
  status = 200

[[redirects]]
  from   = "/api/sing-the-hours"
  to     = "/.netlify/functions/rss-proxy"
  status = 200

[[headers]]
  for = "/api/sing-the-hours"
  [headers.values]
    Cache-Control = "public, s-maxage=1800, stale-while-revalidate=3600"

    
[[redirects]]
  from = "/vault/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true

# Build-time only. publish = "." means everything in the repo root is served,
# so the generated Office corpus and its generator are blocked the same way
# vault/ and supabase/ are. The corpus is ~23 MB of JSON and is not consumed
# by the app over HTTP.
[[redirects]]
  from = "/corpus/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

# ─────────────────────────────────────────────────────────────────────────
# publish = "." means the repo root IS the web root, so everything committed is
# served unless a forced 404 says otherwise. These are the paths that are not
# meant to be public. `force = true` is the operative part in every one of them:
# without it the real file on disk wins and the rule does nothing.
#
# Two of these exist because .gitignore was added AFTER the directory had
# already been committed, and ignoring a tracked path does not untrack it:
# node_modules/ (1,401 files) and ios/ (20 files) are both in .gitignore and
# both still in the repo, and both were therefore being served.
# ─────────────────────────────────────────────────────────────────────────

# Developer documentation. Written for us, not for readers.
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

# Every markdown file, wherever it sits: CLAUDE.md, DESIGN.md, and anything
# under a directory not already blocked. The splat crosses slashes.
[[redirects]]
  from = "/*.md"
  to = "/404"
  status = 404
  force = true

# The Capacitor build output -- a complete second copy of the app, which would
# otherwise be crawlable at /www/index.html alongside the real one.
[[redirects]]
  from = "/www/*"
  to = "/404"
  status = 404
  force = true

# Tracked by accident (see the note above). Dependency source, and the iOS
# project.
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/ios/*"
  to = "/404"
  status = 404
  force = true

# Build and project metadata: dependency versions, the Capacitor app id, and
# this file, which maps the whole site including the corpus layout.
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/capacitor.config.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

# Operator scripts that happen to live at the root, and one stray. Named
# explicitly rather than globbed: a "/generate-*" pattern would overlap the
# non-forced "/*.js" rewrite above, and being exact removes the question.
[[redirects]]
  from = "/generate-demo-audio.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/generate-bedtime-stories.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/diff.txt"
  to = "/404"
  status = 404
  force = true

# Git metadata.
[[redirects]]
  from = "/.gitignore"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.gitattributes"
  to = "/404"
  status = 404
  force = true

# Pre-emptive: untracked today, so not deployed, but committing it would publish
# it. gods-eye-view/ is an unrelated project that happens to sit in this repo.
[[redirects]]
  from = "/gods-eye-view/*"
  to = "/404"
  status = 404
  force = true

# NOT blocked, deliberately, because the app or the stores need them:
#   index.html, assets/*, still-mobile/*, bell-native.js   -- the app itself
#   practices/*, keep/*                                     -- public pages
#   privacy.html, support.html, delete-account.html, reset.html -- store pages
#   partners.html                                           -- gated in-browser
#   robots.txt, sitemap.xml, icon-512.png
#   OneSignalSDKWorker.js  -- nothing registers it now, but a stale service
#                             worker in someone's browser may still fetch it
#   partnerships.pdf       -- unreferenced by any page; left served in case the
#                             URL is handed to partners directly. Block it if not.
#   /.netlify/functions/*  -- the leading dot means /netlify/* cannot match it
#   start/                 -- untracked today; meant to be public when it lands

# Function SOURCE was publicly readable -- verified 2026-08-25, GET
# /netlify/functions/office-corpus.js returned 200. publish = "." serves the
# functions directory like any other, and the non-forced "/*.js" rewrite above
# does not stop it (that one only fires for paths that do NOT exist on disk).
#
# No credentials were exposed: every secret comes from process.env, and the one
# hardcoded literal is the OneSignal App ID, which is a public identifier. What
# leaked is the source itself -- webhook validation logic, endpoint structure.
#
# This does NOT affect the functions themselves. They are served from
# "/.netlify/functions/*", with a leading dot, which this pattern cannot match.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true