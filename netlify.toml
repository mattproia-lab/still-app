[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.send-notifications]
  schedule = "0 1 * * *"

[functions.bell-vigils]
  schedule = "0 9 * * *"

[functions.bell-lauds]
  schedule = "0 11 * * *"

[functions.bell-vespers]
  schedule = "0 23 * * *"

[functions.bell-compline]
  schedule = "0 2 * * *"

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from   = "/api/sing-the-hours"
  to     = "/.netlify/functions/rss-proxy"
  status = 200

[[headers]]
  for = "/api/sing-the-hours"
  [headers.values]
    Cache-Control = "public, s-maxage=1800, stale-while-revalidate=3600"