<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Still</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0f;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card {
    max-width: 380px;
    width: 100%;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 32px;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 24px;
    font-style: italic;
    color: rgba(200,146,12,.9);
    margin-bottom: 8px;
  }
  .sub {
    font-size: 14px;
    color: rgba(255,255,255,.5);
    margin-bottom: 20px;
  }
  input {
    width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    outline: none;
    margin-bottom: 10px;
  }
  input::placeholder { color: rgba(255,255,255,.3); }
  #msg {
    display: none;
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: rgba(200,146,12,.2);
    border: 1px solid rgba(200,146,12,.4);
    color: #f0c040;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 10px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: rgba(255,73,64,.8); }
  .success { color: rgba(200,146,12,.8); }
</style>
</head>
<body>
<div class="card">
  <h1>Reset Password</h1>
  <p class="sub">Enter your new password below.</p>
  <input id="pw1" type="password" placeholder="New password" />
  <input id="pw2" type="password" placeholder="Confirm password" />
  <div id="msg"></div>
  <button id="btn">Set New Password</button>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');

  if (!token) {
    document.getElementById('msg').textContent = 'Invalid or expired reset link.';
    document.getElementById('msg').className = 'error';
    document.getElementById('msg').style.display = 'block';
    document.getElementById('btn').disabled = true;
    return;
  }

  document.getElementById('btn').onclick = async function() {
    var pw = document.getElementById('pw1').value;
    var c = document.getElementById('pw2').value;
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn');

    if (!pw || pw.length < 6) {
      msg.textContent = 'Password must be at least 6 characters.';
      msg.className = 'error';
      msg.style.display = 'block';
      return;
    }
    if (pw !== c) {
      msg.textContent = 'Passwords do not match.';
      msg.className = 'error';
      msg.style.display = 'block';
      return;
    }

    btn.textContent = 'Updating\u2026';
    btn.disabled = true;

    try {
      var res = await fetch('https://zbskapivansfewegllnz.supabase.co/auth/v1/user', {
        method: 'PUT',
        headers: {
          'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpic2thcGl2YW5zZmV3ZWdsbG56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDI4NzcsImV4cCI6MjA5MzU3ODg3N30.NdmTcuGPRd_oosaa7P6sKbMUduiSVji8cz7XRQdRLvI',
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ password: pw })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.msg || data.error_description || 'Reset failed');

      msg.textContent = 'Password updated successfully. Redirecting\u2026';
      msg.className = 'success';
      msg.style.display = 'block';
      btn.textContent = 'Done';
      setTimeout(function() { window.location.href = '/'; }, 2500);
    } catch(e) {
      msg.textContent = e.message || 'Something went wrong. Try again.';
      msg.className = 'error';
      msg.style.display = 'block';
      btn.textContent = 'Set New Password';
      btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
